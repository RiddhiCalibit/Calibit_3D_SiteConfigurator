services:
  - type: web
    name: calibit-3d-siteconfigurator
    runtime: node
    rootDir: backend
    buildCommand: npm install && cd ../frontend && npm install && npm run build && cd ../backend && npx tsc
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
