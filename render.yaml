services:
  - type: web
    name: Calibit_3D_SiteConfigurator
    runtime: node
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install && npx tsc
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
